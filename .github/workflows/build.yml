name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: runs-on=${{ github.run_id }}-changes/runner=ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
    steps:
      - uses: runs-on/action@v2

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether only docs changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi
          files=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$files"
          # Any changed file that is NOT documentation
          code=$(echo "$files" | grep -vE '(^docs/|\.md$|\.adoc$|\.txt$|^CODEOWNERS$|^LICENSE$|^\.gitignore$|^\.all-contributorsrc$)' || true)
          if [ -n "$files" ] && [ -z "$code" ]; then
            echo "Only documentation changed - tests will be skipped"
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    name: JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java-version: [ 17, 21, 25 ]
        include:
          - os: windows-latest
            test-containers: "false"
          - os: ubuntu-latest
            test-containers: "true"
    runs-on: runs-on=${{ github.run_id }}-${{ strategy.job-index }}/runner=${{ matrix.os }}
    steps:
      - uses: runs-on/action@v2

      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B clean install -Dno-format -Dtest-containers=${{ matrix.test-containers }} ${{ needs.changes.outputs.docs-only == 'true' && '-DskipTests -DskipITs' || '' }}

  build-native:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    name: Native / ${{ matrix.module }} / JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ 17 ]
        module:
          - http
          - stdio
          - websocket
          - cli-adapter
          - hibernate-validator
        include:
          - module: http
            pl: transports/http/integration-tests,transports/http/authorization-integration-tests,transports/http/tracing-integration-tests
          - module: stdio
            pl: transports/stdio/integration-tests,transports/stdio/tracing-integration-tests
          - module: websocket
            pl: transports/websocket/integration-tests,transports/websocket/tracing-integration-tests
          - module: cli-adapter
            pl: cli-adapter/integration-tests
          - module: hibernate-validator
            pl: hibernate-validator/integration-tests
    runs-on: runs-on=${{ github.run_id }}-${{ strategy.job-index }}/runner=${{ matrix.os }}
    steps:
      - uses: runs-on/action@v2

      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B clean install -Dno-format -DskipTests

      - name: Build with Maven (Native)
        run: ./mvnw -B install -Dnative -Dquarkus.native.container-build -Dnative.surefire.skip -pl ${{ matrix.pl }}

  build-samples:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    name: Samples / ${{ matrix.sample }} / JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ 17 ]
        sample:
          - multiple-secure-mcp-http-servers
          - secure-mcp-sse-server
          - weather
    runs-on: runs-on=${{ github.run_id }}-${{ strategy.job-index }}/runner=${{ matrix.os }}
    steps:
      - uses: runs-on/action@v2

      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Build sample - ${{ matrix.sample }}
        working-directory: './samples/${{ matrix.sample }}'
        run: ./mvnw -B clean install

  mcp-conformance-tests:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    name: MCP Conformance Tests / JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ 17 ]
    runs-on: runs-on=${{ github.run_id }}-${{ strategy.job-index }}/runner=${{ matrix.os }}
    steps:
      - uses: runs-on/action@v2

      - uses: actions/checkout@v7
      # MCP conformance tests require 24
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B clean install -Dno-format -DskipTests
             
      - name: Build test server
        working-directory: './conformance'
        run: ../mvnw -B clean install
        
      - name: Start test server
        working-directory: './conformance'
        run: nohup java -Dquarkus.http.host=localhost -jar target/quarkus-app/quarkus-run.jar & echo $! > app.pid
        id: start_test_server
        
      - name: Run MCP conformance tests
        working-directory: './conformance'
        run: npx @modelcontextprotocol/conformance server --url http://localhost:8080/mcp

      - name: Stop test server
        if: steps.start_test_server.outcome == 'success'
        working-directory: './conformance'
        run: kill $(cat app.pid) || true
